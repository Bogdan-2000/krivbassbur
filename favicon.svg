<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Темно-сірий фон (як на сайті) із закругленими кутами -->
  <rect width="100" height="100" rx="20" fill="#111111"/>
  
  <!-- Оранжеве коло-обведення -->
  <circle cx="50" cy="50" r="44" stroke="#FF6B00" stroke-width="6" fill="none"/>
  
  <!-- Текст KBR (збільшений, з відступами та зміщений трохи правіше) -->
  <text x="53" y="66" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="3">
    <tspan fill="#FFFFFF">K</tspan><tspan fill="#FF6B00">BR</tspan>
  </text>
</svg>
